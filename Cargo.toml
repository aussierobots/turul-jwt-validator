[package]
name = "turul-jwt-validator"
version = "0.3.6"
edition = "2024"
rust-version = "1.85"
authors = ["Nick Hortovanyi <nick@aussierobots.com.au>"]
license = "MIT OR Apache-2.0"
description = "Generic JWT validator with JWKS caching and kid-miss refresh"
repository = "https://github.com/aussierobots/turul-jwt-validator"
homepage = "https://aussierobots.com.au/turul-jwt.html"
keywords = ["jwt", "jwks", "auth", "oauth", "validation"]
categories = ["authentication", "web-programming"]
documentation = "https://docs.rs/turul-jwt-validator"

[features]
default = ["aws_lc_rs"]
## The `jwks` feature: `JwtValidator` and its JWKS fetching (reqwest, tokio, tracing). Implied by `aws_lc_rs` and `rust_crypto`.
jwks = ["dep:reqwest", "dep:tokio", "dep:tracing"]
## The `aws_lc_rs` feature: AWS-LC crypto backend for jsonwebtoken (default).
aws_lc_rs = ["jwks", "jsonwebtoken/aws_lc_rs"]
## The `rust_crypto` feature: pure-Rust (RustCrypto) crypto backend for jsonwebtoken, as an
## alternative to aws_lc_rs. Use `default-features = false, features =
## ["rust_crypto"]` to select this backend instead.
rust_crypto = ["jwks", "jsonwebtoken/rust_crypto"]
## The `detached_rust_crypto` feature: detached JWS API with the RustCrypto backend; no reqwest or tokio.
detached_rust_crypto = ["jsonwebtoken/rust_crypto", "dep:p256", "dep:base64"]
## The `detached_aws_lc_rs` feature: detached JWS API with the AWS-LC backend; no reqwest or tokio.
detached_aws_lc_rs = ["jsonwebtoken/aws_lc_rs", "dep:p256", "dep:base64"]

[package.metadata.docs.rs]
# Render JwtValidator and the detached module together, on one backend.
no-default-features = true
features = ["aws_lc_rs", "detached_aws_lc_rs"]

[dependencies]
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "time"], optional = true }
tracing = { version = "0.1", optional = true }
thiserror = "2.0"
p256 = { version = "0.14", default-features = false, features = ["arithmetic"], optional = true }
base64 = { version = "0.23", optional = true }

[[test]]
name = "jwt_e2e"
required-features = ["jwks"]

[[test]]
name = "jwks_resilience"
required-features = ["jwks"]

[[example]]
name = "validate-token"
required-features = ["jwks"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }
axum = "0.8"
rsa = { version = "0.9", features = ["pem"] }
p256 = { version = "0.14", features = ["pem", "pkcs8"] }
rand = "0.10"
base64 = "0.23"
wiremock = "0.6"
