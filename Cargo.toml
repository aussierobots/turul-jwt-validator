[package]
name = "turul-jwt-validator"
version = "0.3.2"
edition = "2024"
rust-version = "1.85"
authors = ["Nick Hortovanyi <nick@aussierobots.com.au>"]
license = "MIT OR Apache-2.0"
description = "Generic JWT validator with JWKS caching and kid-miss refresh"
repository = "https://github.com/aussierobots/turul-jwt-validator"
homepage = "https://github.com/aussierobots/turul-jwt-validator"
keywords = ["jwt", "jwks", "auth", "oauth", "validation"]
categories = ["authentication", "web-programming"]

[features]
default = ["aws_lc_rs"]
## AWS-LC crypto backend for jsonwebtoken (default).
aws_lc_rs = ["jsonwebtoken/aws_lc_rs"]
## Pure-Rust (RustCrypto) crypto backend for jsonwebtoken, as an
## alternative to aws_lc_rs. Use `default-features = false, features =
## ["rust_crypto"]` to select this backend instead.
rust_crypto = ["jsonwebtoken/rust_crypto"]

[dependencies]
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
thiserror = "2.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }
axum = "0.8"
rsa = { version = "0.9", features = ["pem"] }
p256 = { version = "0.14", features = ["pem", "pkcs8"] }
rand = "0.10"
base64 = "0.23"
wiremock = "0.6"
