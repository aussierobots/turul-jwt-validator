[package]
name = "turul-jwt-validator"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
authors = ["Nick Hortovanyi <nick@aussierobots.com.au>"]
license = "MIT OR Apache-2.0"
description = "Generic JWT validator with JWKS caching and kid-miss refresh"
repository = "https://github.com/aussierobots/turul-jwt-validator"
homepage = "https://github.com/aussierobots/turul-jwt-validator"
keywords = ["jwt", "jwks", "auth", "oauth", "validation"]
categories = ["authentication", "web-programming"]

[dependencies]
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
thiserror = "2.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
rsa = { version = "0.9", features = ["pem"] }
p256 = { version = "0.14", features = ["pem", "pkcs8"] }
rand = "0.10"
base64 = "0.23"
wiremock = "0.6"
